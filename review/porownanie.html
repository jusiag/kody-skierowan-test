=\"checkInfo\"><\/p>\n      <p><strong>Kody resortowe<\/strong> (specjalności komórek organizacyjnych): rozporządzenie Ministra Zdrowia z 17.05.2012 r. w sprawie systemu resortowych kodów identyfikacyjnych, załącznik nr 2, część VIII (tekst jednolity z 2019 r., Dz. U. poz. 173; <a href=\"https://eli.gov.pl/api/acts/DU/2019/173/text.html\" target=\"_blank\" rel=\"noopener\">tekst<\/a>). <span id=\"resInfo\"><\/span><\/p>\n      <p>Dane zostały przetworzone: plik NFZ (xlsx) przekształcono na format wyszukiwarki, bez zmiany nazw ani kodów procedur. Aplikacja jest nieoficjalna i nie pochodzi od NFZ ani Ministerstwa Zdrowia. Obowiązuje wersja ze strony NFZ.<\/p>\n      <p><strong>Zastrzeżenie.<\/strong> Aplikacja ma charakter pomocniczy i nie zastępuje oficjalnego słownika NFZ ani decyzji lekarza. Ostateczny wybór kodu na skierowaniu należy do lekarza, a autorka aplikacji nie odpowiada za skutki użycia kodów. Zauważyłeś błąd w kodzie albo w działaniu strony? <a href=\"https://github.com/jusiag/kody-skierowan/issues\" target=\"_blank\" rel=\"noopener\">Zgłoś uwagę<\/a> (potrzebne jest konto GitHub).<\/p>\n    <\/div>\n    <span>Na skierowaniu do poradni specjalistycznej zwykle wystarcza kod 89.00 albo kod konkretnej konsultacji. Na badanie wpisuje się kod tego badania. Kod zawsze dobiera lekarz.<\/span>\n    <span class=\"hint\">Ikona na telefonie: Android (Chrome) menu ⋮ → „Dodaj do ekranu głównego”. iPhone (Safari) Udostępnij → „Do ekranu początkowego”. Po pierwszym otwarciu aplikacja działa także bez internetu.<\/span>\n  <\/footer>\n<\/div>\n\n\n<div class=\"toast\" id=\"toast\" hidden><\/div>\n\n\n\n\n<\/body>\n<\/html>\n","oldDark":"<!doctype html>\n<html lang=\"pl\" data-theme=\"dark\">\n<head>\n<meta charset=\"utf-8\">\n\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Kody do skierowań<\/title>\n<meta name=\"description\" content=\"Wyszukiwarka kodów do skierowań: kody procedur ICD-9 PL (słownik NFZ) i kody res uje się kod tego badania. Kod zawsze dobiera lekarz.<\/span>\n    <span class=\"hint install-info\">Ikona na telefonie: Android (Chrome) menu ⋮ → „Dodaj do ekranu głównego”. iPhone (Safari) Udostępnij → „Do ekranu początkowego”. Po pierwszym otwarciu aplikacja działa także bez internetu.<\/span>\n  <\/footer>\n<\/main>\n\n\n<div class=\"toast\" id=\"toast\" aria-hidden=\"true\"><\/div>\n<div class=\"sr-only\" id=\"announcement\" role=\"status\" aria-live=\"polite\" aria-atomic=\"true\"><\/div>\n\n\n\n\n<\/body>\n<\/html>\n","newDark":"<!doctype html>\n<html lang=\"pl\" data-theme=\"dark\">\n<head>\n<meta charset=\"utf-8\">\n\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Kody do skierowań<\/title>\n<meta name=\"description\" content=\"Wyszukiwarka kodów do skierowań: kody procedur ICD-9 PL (słownik NFZ) i kody resortowe komórek (poradni, oddziałów). Działa bez internetu.\">\n<meta name=\"theme-color\" content=\"#f4f7f6\" media=\"(prefers-color-scheme: light)\">\n<meta name=\"theme-color\" content=\"#101917\" media=\"(prefers-color-scheme: dark)\">\n\n\n\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-title\" content=\"Kody do skierowań\">\n\n<style>/* Clinical Minimal — local system fonts, no remote assets. */\n:root {\n  color-scheme: light;\n  --bg:#f4f7f6; --surface:#fff; --ink:#182c2a; --muted:#536761;\n  --line:#d4dfdc; --control-line:#778e86; --accent:#126655; --accent-soft:#e5f2ed;\n  --code-bg:#f3f8f6; --on-accent:#fff; --warn-bg:#fff4dc; --warn-ink:#694600;\n  --warn-line:#a67a25; --ok:#236643; --err:#a12b36;\n  --font-body:system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;\n  --font-code:ui-monospace,\"SF Mono\",Menlo,Consolas,monospace;\n  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px;\n  --radius-sm:6px; --radius:12px; --content-width:780px;\n  p a i nie pochodzi od NFZ ani Ministerstwa Zdrowia. Obowiązuje wersja ze strony NFZ.<\/p>\n      <p class=\"legal\"><strong>Zastrzeżenie.<\/strong> Aplikacja ma charakter pomocniczy i nie zastępuje oficjalnego słownika NFZ ani decyzji lekarza. Ostateczny wybór kodu na skierowaniu należy do lekarza, a autorka aplikacji nie odpowiada za skutki użycia kodów. Zauważyłeś błąd w kodzie albo w działaniu strony? <a href=\"https://github.com/jusiag/kody-skierowan/issues\" target=\"_blank\" rel=\"noopener\">Zgłoś uwagę<\/a> (potrzebne jest konto GitHub).<\/p>\n    <\/div>\n    <span>Na skierowaniu do poradni specjalistycznej zwykle wystarcza kod 89.00 albo kod konkretnej konsultacji. Na badanie wpisuje się kod tego badania. Kod zawsze dobiera lekarz.<\/span>\n    <span class=\"hint install-info\">Ikona na telefonie: Android (Chrome) menu ⋮ → „Dodaj do ekranu głównego”. iPhone (Safari) Udostępnij → „Do ekranu początkowego”. Po pierwszym otwarciu aplikacja działa także bez internetu.<\/span>\n  <\/footer>\n<\/main>\n\n\n<div class=\"toast\" id=\"toast\" aria-hidden=\"true\"><\/div>\n<div class=\"sr-only\" id=\"announcement\" role=\"status\" aria-live=\"polite\" aria-atomic=\"true\"><\/div>\n\n\n\n\n<\/body>\n<\/html>\n"};function render(){for(const id of ['old','new']){const f=document.getElementById(id);f.width=document.getElementById('width').value;f.srcdoc=frames[id+document.getElementById('theme').value];}}document.getElementById('width').onchange=render;document.getElementById('theme').onchange=render;render();</script></html>
